name: Verify FeqhMuseWeb
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  guided-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: node --check app.js
      - name: Verify Persian guided review and C4 evidence
        run: node tests/smoke.mjs
      - name: Ensure only static Pages assets are needed
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s data/review-data.json
          test ! -f server.mjs
          test ! -f Dockerfile
          test ! -f .env.example
